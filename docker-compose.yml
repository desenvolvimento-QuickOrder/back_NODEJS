# Sobe só o back-node. Depende do compose do back-java (Redis e core) na rede "quickorder":
#   (no back-java) docker compose up -d
#   (aqui)         docker compose up -d --build
name: quickorder-node

services:
  node:
    build: .
    image: quickorder-node:local
    environment:
      NODE_ENV: production
      PORT: 3000
      LOG_LEVEL: info
      REDIS_URL: redis://redis:6379
      JWKS_URL: http://core:8080/api/v1/.well-known/jwks.json
      CORS_ORIGINS: http://localhost:5173
      TRUST_PROXY_HOPS: 0
    ports:
      - '${NODE_PORT:-3000}:3000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 5

networks:
  default:
    name: quickorder
    external: true
